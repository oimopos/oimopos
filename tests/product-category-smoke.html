<!doctype html><meta charset="utf-8"><pre id="results">RUNNING</pre><iframe id="app" src="../admin.html?test=1#menu/products"></iframe><script>
if(new URLSearchParams(location.search).has("preview")) app.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:white";
app.onload=async()=>{const w=app.contentWindow,d=w.document,c=[];const check=(n,v)=>c.push(`${v?'PASS':'FAIL'}:${n}`);try{
w.openProductForm();d.querySelector('#productNameInput').value='Тест новой категории';d.querySelector('#productPriceInput').value=150;d.querySelector('#productBarcodeInput').value='555666';d.querySelector('#productCategorySearch').value='Новая категория тест';
d.querySelector('#productCostInput').value=100;d.querySelector('#productMarkupInput').value=50;d.querySelector('#productMarkupInput').dispatchEvent(new w.Event('input',{bubbles:true}));check('markup-calculates-price',d.querySelector('#productPriceInput').value==='150');
d.querySelector('#productPriceInput').value=200;w.updateProductCalculation();check('price-calculates-markup',d.querySelector('#productMarkupInput').value==='100');d.querySelector('#productPriceInput').value=150;w.updateProductCalculation();
d.querySelector('#productColorInput').value='#336699';d.querySelector('#productColorInput').dispatchEvent(new w.Event('input',{bubbles:true}));
const canvas=d.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);w.eval('productPhotoDraft = '+JSON.stringify(canvas.toDataURL()));w.renderProductCover();check('photo-preview',!!d.querySelector('#productCoverPreview img'));
check('inline-create',await w.ensureProductCategory());check('draft-preserved',d.querySelector('#productNameInput').value==='Тест новой категории'&&d.querySelector('#productPriceInput').value==='150'&&d.querySelector('#productBarcodeInput').value==='555666');
check('category-selected',d.querySelector('#productCategoryInput').value==='Новая категория тест');await w.ensureProductCategory();check('no-duplicate',w.eval('menuCategories.filter(c=>c.name === "Новая категория тест").length')===1);
await w.saveProductForm(true);check('saved-product-category',w.eval('products.some(p=>p.name === "Тест новой категории" && p.category === "Новая категория тест")'));check('cover-saved',w.eval('products.some(p=>p.name === "Тест новой категории" && p.color === "#336699" && p.image.startsWith("data:image/png"))'));check('new-form-open',!d.querySelector('#productModal').classList.contains('hidden')&&d.querySelector('#productNameInput').value==='');
if(new URLSearchParams(location.search).has('preview')) { d.querySelector('#productOpeningBlock').classList.add('hidden'); d.activeElement.blur(); }
}catch(e){c.push('FAIL:'+e.stack)}results.textContent=c.join('|')};</script>

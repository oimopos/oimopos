<!doctype html><meta charset="utf-8"><pre id="results">RUNNING</pre><iframe id="app" src="../admin.html?test=1#menu/products" style="width:1400px;height:1000px"></iframe><script>
if(new URLSearchParams(location.search).has("preview")) app.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:white";
app.onload=async()=>{const w=app.contentWindow,d=w.document,c=[];const check=(n,v)=>c.push(`${v?'PASS':'FAIL'}:${n}`);try {
w.openProductForm();d.querySelector('#productNameInput').value='Тест сок';const station=d.querySelector('#productStationInput');station.selectedIndex=1;const stationName=station.value;
const mode=d.querySelector('#productVariantsEnabled');mode.checked=true;mode.dispatchEvent(new w.Event('change'));
check('mode-hides-single-price',d.querySelector('#productSinglePriceSection').classList.contains('hidden'));
d.querySelector('[data-variant-name]').value='Яблоко';d.querySelector('[data-variant-price]').value=100;d.querySelector('#addProductVariant').click();const rows=d.querySelectorAll('.product-variant-row');rows[1].querySelector('[data-variant-name]').value='Апельсин';rows[1].querySelector('[data-variant-price]').value=120;
const color=rows[1].querySelector('[data-variant-color]');color.value='#aabbcc';color.dispatchEvent(new w.Event('input',{bubbles:true}));
await w.saveProductForm();const variants=w.eval('products.filter(p=>p.groupName==="Тест сок")');check('variant-own-color',variants[1].color==='#aabbcc');check('two-skus',variants.length===2&&variants[0].id!==variants[1].id);check('station-saved',variants.every(p=>p.station===stationName));check('group-one-row',d.querySelectorAll(`[data-product-edit="${variants[1].id}"]`).length===0);
w.openProductForm(variants[0].id);check('edit-restores',d.querySelectorAll('.product-variant-row').length===2&&mode.checked&&station.value===stationName);d.querySelector('[data-variant-price]').value=115;await w.saveProductForm();check('edit-preserves-id',w.productById(variants[0].id).price===115);
if(new URLSearchParams(location.search).has('preview')) w.openProductForm(variants[0].id);
}catch(e){c.push('FAIL:'+e.stack)}results.textContent=c.join('|')};</script>

<!doctype html><meta charset="utf-8"><title>Terminal responsive checks</title><pre id="results">RUNNING</pre><script>
(async()=>{
 const results=[];
 for(const mode of ['catalog','checkout','supply','archive','production','production-many','pin','receiving','kitchen-shift']){
  const outer=document.createElement('iframe');outer.style.cssText='width:390px;height:844px;border:0';document.body.append(outer);
  outer.src='/tests/pos-ui-smoke.html?preview='+mode;
  await new Promise(r=>outer.onload=r);await new Promise(r=>setTimeout(r,1800));
  const frame=outer.contentDocument.querySelector('iframe');const doc=frame.contentDocument,win=frame.contentWindow;
  for(const [width,height] of [[320,568],[390,844],[768,1024],[1024,768],[844,390],[1440,900]]){
   outer.style.width=width+'px';outer.style.height=height+'px';await new Promise(r=>setTimeout(r,70));
   const visible=el=>el.getBoundingClientRect().width&&el.getBoundingClientRect().height&&win.getComputedStyle(el).visibility!=='hidden';
   let root=mode==='catalog'?doc.querySelector('.catalog-panel'):doc.querySelector(mode==='checkout'?'#paymentModal':mode==='supply'?'#supplyDrawer':mode==='archive'?'#historyDrawer':mode==='pin'?'#operatorLock':mode==='receiving'?'#receivingDrawer':mode==='kitchen-shift'?'#productionShiftDrawer':'#productionDrawer');
   const failures=[];
   if(mode==='production-many'){
     for(const id of ['addProductionLine','saveProductionButton']){
       const b=doc.getElementById(id).getBoundingClientRect();
       if(b.top<0||b.bottom>height+1||!b.height)failures.push(id+' not visible');
     }
   }

   if(doc.documentElement.scrollWidth>width+1)failures.push('page overflow '+doc.documentElement.scrollWidth);
   for(const el of root.querySelectorAll('input,select,button')){
    if(!visible(el))continue;
    const b=el.getBoundingClientRect();if(b.left < -1||b.right>width+1)failures.push((el.id||el.className||el.tagName)+' horizontal '+Math.round(b.right));
   }
   if(mode==='catalog'&&width<=700){
    doc.querySelector('[data-pos-view="receipt"]').click();
    const pay=doc.querySelector('#payButton')||doc.querySelector('.order-footer .pay-button');const b=pay.getBoundingClientRect();
    if(b.bottom>height+1||b.top<0||!b.width)failures.push('payment button inaccessible');
    doc.querySelector('[data-pos-view="catalog"]').click();
   }
   results.push(`${failures.length?'FAIL':'PASS'} ${mode} ${width}x${height} ${failures.join('; ')}`);
  }
  outer.remove();
 }
 document.querySelector('#results').textContent=results.join('\n');
})().catch(e=>document.querySelector('#results').textContent='ERROR '+e.stack);
</script>

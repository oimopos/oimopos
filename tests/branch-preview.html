<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Branch creation preview</title>
    <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}iframe{display:block}</style>
  </head>
  <body>
    <iframe id="app" title="Предпросмотр создания точки"></iframe>
    <script>
      sessionStorage.setItem("ashkana-auth-session-v1", JSON.stringify({ login: "admin", role: "owner", name: "Дастан", roleLabel: "Главный администратор", scope: "Все точки", initials: "ДА" }));
      const frame = document.querySelector("#app");
      frame.addEventListener("load", () => {
        frame.contentWindow.switchView("branches");
        frame.contentWindow.openBranchForm(new URLSearchParams(location.search).get("mode") === "edit" ? "b1" : null);
      });
      frame.src = "../admin.html?v=23#branches";
    </script>
  </body>
</html>
